name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:production
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --frozen
      - run: uv run pytest -q --ignore=worker/tests/integration
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fantasy_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: fantasy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fantasy_test -d fantasy_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fantasy_test:test_only@127.0.0.1:5432/fantasy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: npm ci
      - run: uv sync --frozen
      - run: npm run test:postgres
      - run: uv run pytest -q worker/tests/integration
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fantasy-web .
      - run: docker build -f worker/Dockerfile -t fantasy-sync .
      - name: Verify packaged runtimes
        run: |
          docker run --rm --entrypoint node fantasy-web -e "require('node:sqlite'); require('pg'); require('node:fs').accessSync('public')"
          docker run --rm --entrypoint .venv/bin/python fantasy-sync -c "import worker.sync; from zoneinfo import ZoneInfo; ZoneInfo('America/Los_Angeles')"
