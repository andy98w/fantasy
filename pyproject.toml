[project]
name = "fantasy-sync"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "feedparser>=6.0,<7", "python-dotenv>=1.1,<2", "psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["worker/tests"]
